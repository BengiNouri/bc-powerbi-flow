# ─────────────────────────────────────────────────────────────────────────────
# report_spec.example.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Den oprindelige CRONUS-demo-rapport som spec. Bevares som regressionsbase:
# gen_pbi_report.py producerer identisk visual.json-struktur uanset om
# rapporten bygges fra hardcoded page builders (gammelt) eller fra denne fil
# (nyt). Brug denne fil som udgangspunkt for ny kunde — kopiér til
# output/report_spec.yaml og redigér.
#
# Skemaet er dokumenteret i templates/report_spec.schema.yaml.

version: 1

canvas:
  width: 1280
  height: 720
  margin_x: 20
  title_y: 10
  title_h: 48
  kpi_y: 70
  kpi_h: 110
  content_y: 200
  content_h: 490

pages:

  # ─── 1. EXECUTIVE ─────────────────────────────────────────────────────────
  - key: "exec"
    display_name: "1. Executive Dashboard"
    title: "{client_name} — Executive Dashboard"
    visuals:
      - { type: "lineChart",            id: "rev_month",     title: "Revenue by Month",
          x: 20,  y: 200, w: 620, h: 240,
          category: { table: "gold_dim_date",     column: "Year Month" },
          values:   [{ table: "_Measures", measure: "Revenue" }] }

      - { type: "clusteredBarChart",    id: "rev_industry",  title: "Revenue by Industry",
          x: 660, y: 200, w: 600, h: 240,
          category: { table: "gold_dim_customer", column: "industry" },
          values:   [{ table: "_Measures", measure: "Revenue" }] }

      - { type: "donutChart",           id: "pipe_stage",    title: "Pipeline by Status",
          x: 20,  y: 450, w: 410, h: 240,
          category: { table: "gold_fact_pipeline", column: "Deal Status" },
          values:   [{ table: "_Measures", measure: "Pipeline Value" }] }

      - { type: "clusteredColumnChart", id: "budget_cat",    title: "Budget vs Actual",
          x: 450, y: 450, w: 420, h: 240,
          category: { table: "gold_fact_budget", column: "category" },
          values: [
            { table: "_Measures", measure: "Budget Total" },
            { table: "_Measures", measure: "Actual Total" }
          ] }

      - { type: "lineChart",            id: "nps_quarter",   title: "NPS by Quarter",
          x: 890, y: 450, w: 370, h: 240,
          category: { table: "gold_fact_nps", column: "quarter" },
          values:   [{ table: "_Measures", measure: "NPS Score" }] }

  # ─── 2. PIPELINE ──────────────────────────────────────────────────────────
  - key: "pipeline"
    display_name: "2. Pipeline & CRM"
    title: "Pipeline & CRM"
    visuals:
      - { type: "slicer",               id: "country",
          x: 20, y: 200, w: 240, h: 70,
          field: { table: "gold_dim_customer", column: "Country Group" } }

      - { type: "donutChart",           id: "stage",         title: "Pipeline by Stage",
          x: 280, y: 200, w: 380, h: 240,
          category: { table: "gold_fact_pipeline", column: "stage" },
          values:   [{ table: "_Measures", measure: "Pipeline Value" }] }

      - { type: "clusteredBarChart",    id: "owner",         title: "Pipeline by Owner",
          x: 680, y: 200, w: 580, h: 240,
          category: { table: "gold_fact_pipeline", column: "Deal Owner" },
          values:   [{ table: "_Measures", measure: "Pipeline Value" }] }

      - { type: "tableEx",              id: "deals",         title: "Open Deals",
          x: 20, y: 450, w: 800, h: 240,
          values: [
            { table: "gold_fact_pipeline", column: "Deal Name" },
            { table: "gold_dim_customer",  column: "Customer Name" },
            { table: "gold_fact_pipeline", column: "stage" },
            { table: "_Measures",          measure: "Pipeline Value" },
            { table: "_Measures",          measure: "Weighted Pipeline" }
          ] }

      - { type: "clusteredColumnChart", id: "win_source",    title: "Win Rate by Source",
          x: 840, y: 450, w: 420, h: 240,
          category: { table: "gold_fact_pipeline", column: "Deal Source" },
          values:   [{ table: "_Measures", measure: "Win Rate" }] }

  # ─── 3. MARKETING ─────────────────────────────────────────────────────────
  - key: "marketing"
    display_name: "3. Marketing & Web"
    title: "Marketing & Web Analytics"
    visuals:
      - { type: "donutChart",           id: "camp_type",     title: "Spend by Campaign Type",
          x: 20, y: 200, w: 400, h: 240,
          category: { table: "gold_dim_campaign", column: "Campaign Type" },
          values:   [{ table: "_Measures", measure: "Marketing Spend" }] }

      - { type: "clusteredBarChart",    id: "leads_campaign", title: "Leads by Campaign",
          x: 440, y: 200, w: 820, h: 240,
          category: { table: "gold_dim_campaign", column: "Campaign Name" },
          values: [
            { table: "_Measures", measure: "Total Leads" },
            { table: "_Measures", measure: "Converted Leads" }
          ] }

      - { type: "clusteredColumnChart", id: "sess_source",   title: "Web Sessions by Source",
          x: 20, y: 450, w: 620, h: 240,
          category: { table: "gold_fact_web_sessions", column: "source" },
          values: [
            { table: "_Measures", measure: "Total Sessions" },
            { table: "_Measures", measure: "Total Web Conversions" }
          ] }

      - { type: "tableEx",              id: "campaigns",     title: "Campaign Performance",
          x: 660, y: 450, w: 600, h: 240,
          values: [
            { table: "gold_dim_campaign", column: "Campaign Name" },
            { table: "gold_dim_campaign", column: "Campaign Type" },
            { table: "_Measures",         measure: "Marketing Spend" },
            { table: "_Measures",         measure: "Total Leads" },
            { table: "_Measures",         measure: "Avg Cost Per Lead" }
          ] }

  # ─── 4. FINANCE ───────────────────────────────────────────────────────────
  - key: "finance"
    display_name: "4. Finance & Budget"
    title: "Finance & Budget"
    visuals:
      - { type: "slicer",               id: "year",
          x: 20, y: 200, w: 240, h: 70,
          field: { table: "gold_dim_date", column: "year" } }

      - { type: "lineChart",            id: "ba_month",      title: "Budget vs Actual by Month",
          x: 280, y: 200, w: 980, h: 240,
          category: { table: "gold_dim_date", column: "Year Month" },
          values: [
            { table: "_Measures", measure: "Budget Total" },
            { table: "_Measures", measure: "Actual Total" }
          ] }

      - { type: "tableEx",              id: "pnl",           title: "P&L by Category",
          x: 20, y: 450, w: 620, h: 240,
          values: [
            { table: "gold_fact_budget", column: "category" },
            { table: "_Measures",        measure: "Budget Total" },
            { table: "_Measures",        measure: "Actual Total" },
            { table: "_Measures",        measure: "Budget Variance" },
            { table: "_Measures",        measure: "Budget Variance %" }
          ] }

      - { type: "clusteredBarChart",    id: "dept_spend",    title: "Actual Spend by Department",
          x: 660, y: 450, w: 600, h: 240,
          category: { table: "gold_fact_budget", column: "department" },
          values:   [{ table: "_Measures", measure: "Actual Total" }] }

  # ─── 5. HR ────────────────────────────────────────────────────────────────
  - key: "hr"
    display_name: "5. HR & People"
    title: "HR & People"
    visuals:
      - { type: "clusteredBarChart",    id: "head_dept",     title: "Headcount by Department",
          x: 20, y: 200, w: 620, h: 240,
          category: { table: "gold_dim_employee", column: "department" },
          values:   [{ table: "_Measures", measure: "Total Headcount" }] }

      - { type: "clusteredColumnChart", id: "util_dept",     title: "Utilization by Department",
          x: 660, y: 200, w: 600, h: 240,
          category: { table: "gold_fact_hr", column: "department" },
          values:   [{ table: "_Measures", measure: "Avg Utilization" }] }

      - { type: "clusteredBarChart",    id: "sal_role",      title: "Salary Cost by Role",
          x: 20, y: 450, w: 620, h: 240,
          category: { table: "gold_dim_employee", column: "role" },
          values:   [{ table: "_Measures", measure: "Total Salary Cost" }] }

      - { type: "tableEx",              id: "emp",           title: "Employee Directory",
          x: 660, y: 450, w: 600, h: 240,
          values: [
            { table: "gold_dim_employee", column: "First Name" },
            { table: "gold_dim_employee", column: "Last Name" },
            { table: "gold_dim_employee", column: "department" },
            { table: "gold_dim_employee", column: "role" },
            { table: "gold_dim_employee", column: "Annual Salary (DKK)" }
          ] }

  # ─── 6. CSAT ──────────────────────────────────────────────────────────────
  - key: "csat"
    display_name: "6. NPS & Support"
    title: "Customer Satisfaction & Support"
    visuals:
      - { type: "donutChart",           id: "nps_cat",       title: "NPS Distribution",
          x: 20, y: 200, w: 400, h: 240,
          category: { table: "gold_fact_nps", column: "NPS Category" },
          values:   [{ table: "_Measures", measure: "NPS Responses" }] }

      - { type: "clusteredColumnChart", id: "tk_prio",       title: "Tickets by Priority",
          x: 440, y: 200, w: 400, h: 240,
          category: { table: "gold_fact_tickets", column: "priority" },
          values:   [{ table: "_Measures", measure: "Total Tickets" }] }

      - { type: "donutChart",           id: "tk_cat",        title: "Tickets by Category",
          x: 860, y: 200, w: 400, h: 240,
          category: { table: "gold_fact_tickets", column: "category" },
          values:   [{ table: "_Measures", measure: "Total Tickets" }] }

      - { type: "tableEx",              id: "tk_table",      title: "Open Tickets",
          x: 20, y: 450, w: 1240, h: 240,
          values: [
            { table: "gold_fact_tickets", column: "ticket_id" },
            { table: "gold_fact_tickets", column: "Company Name" },
            { table: "gold_fact_tickets", column: "category" },
            { table: "gold_fact_tickets", column: "priority" },
            { table: "gold_fact_tickets", column: "status" },
            { table: "_Measures",         measure: "Avg Response Time Hours" }
          ] }

  # ─── 7. QUALITY ───────────────────────────────────────────────────────────
  - key: "quality"
    display_name: "7. Quality & Compliance"
    title: "Quality & Compliance"
    visuals:
      - { type: "lineChart",            id: "tk_cat_month",  title: "Tickets over Time",
          x: 20, y: 200, w: 620, h: 240,
          category: { table: "gold_dim_date", column: "Year Month" },
          values:   [{ table: "_Measures", measure: "Total Tickets" }] }

      - { type: "clusteredBarChart",    id: "sla_cat",       title: "SLA Met Rate by Category",
          x: 660, y: 200, w: 600, h: 240,
          category: { table: "gold_fact_tickets", column: "category" },
          values:   [{ table: "_Measures", measure: "SLA Met Rate" }] }

      - { type: "tableEx",              id: "critical_tk",   title: "Critical Issues",
          x: 20, y: 450, w: 1240, h: 240,
          values: [
            { table: "gold_fact_tickets", column: "ticket_id" },
            { table: "gold_fact_tickets", column: "Company Name" },
            { table: "gold_fact_tickets", column: "category" },
            { table: "gold_fact_tickets", column: "priority" },
            { table: "gold_fact_tickets", column: "status" },
            { table: "gold_fact_tickets", column: "sla_met" },
            { table: "_Measures",         measure: "Avg Resolution Days" }
          ] }

  # ─── CUSTOMER DETAIL (drill-through) ──────────────────────────────────────
  - key: "customer_detail"
    display_name: "Customer Detail"
    title: "Customer Detail"
    drill_through: true
    visuals:
      - { type: "lineChart",            id: "cust_rev_trend", title: "Revenue Trend",
          x: 20, y: 200, w: 620, h: 240,
          category: { table: "gold_dim_date", column: "Year Month" },
          values:   [{ table: "_Measures", measure: "Revenue" }] }

      - { type: "tableEx",              id: "cust_deals",    title: "Deal History",
          x: 660, y: 200, w: 600, h: 240,
          values: [
            { table: "gold_fact_pipeline", column: "Deal Name" },
            { table: "gold_fact_pipeline", column: "stage" },
            { table: "gold_fact_pipeline", column: "Deal Status" },
            { table: "_Measures",          measure: "Pipeline Value" }
          ] }

      - { type: "tableEx",              id: "cust_tickets",  title: "Support Ticket History",
          x: 20, y: 450, w: 1240, h: 240,
          values: [
            { table: "gold_fact_tickets", column: "ticket_id" },
            { table: "gold_fact_tickets", column: "category" },
            { table: "gold_fact_tickets", column: "priority" },
            { table: "gold_fact_tickets", column: "status" },
            { table: "_Measures",         measure: "Avg Response Time Hours" }
          ] }

  # ─── EMPLOYEE DETAIL (drill-through) ──────────────────────────────────────
  - key: "employee_detail"
    display_name: "Employee Detail"
    title: "Employee Detail"
    drill_through: true
    visuals:
      - { type: "lineChart",            id: "emp_util",      title: "Utilization Trend",
          x: 20, y: 200, w: 620, h: 240,
          category: { table: "gold_fact_hr", column: "period" },
          values:   [{ table: "_Measures", measure: "Avg Utilization" }] }

      - { type: "clusteredColumnChart", id: "emp_hours",     title: "Hours Allocation",
          x: 660, y: 200, w: 600, h: 240,
          category: { table: "gold_fact_hr", column: "period" },
          values: [
            { table: "_Measures", measure: "Total Billable Hours" },
            { table: "_Measures", measure: "Total Internal Hours" }
          ] }

      - { type: "tableEx",              id: "emp_details",   title: "Profile",
          x: 20, y: 450, w: 1240, h: 240,
          values: [
            { table: "gold_dim_employee", column: "First Name" },
            { table: "gold_dim_employee", column: "Last Name" },
            { table: "gold_dim_employee", column: "department" },
            { table: "gold_dim_employee", column: "role" },
            { table: "gold_dim_employee", column: "Hire Date" },
            { table: "gold_dim_employee", column: "Annual Salary (DKK)" }
          ] }
