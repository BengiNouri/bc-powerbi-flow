client_name: "Coloplast"
language: "da-DK"
locale_decimal: ","
currency_suffix: "DKK"

colors:
  primary:    "#003F5C"
  secondary:  "#00A4E4"
  accent:     "#E8F4FA"
  success:    "#3FA34D"
  warning:    "#E67E22"
  danger:     "#C8102E"
  background: "#FFFFFF"
  text:       "#1A1A1A"

typography:
  heading_font: "Inter"
  body_font:    "Inter"
  sizes:
    page_title:    24
    kpi_label:     12
    kpi_callout:   36
    section_title: 16
    chart_label:   11
    table_header:  12
    table_cell:    11
  bold_kpi_label:  false
  bold_kpi_number: true

logo:
  path_light:    "demo-clients/coloplast/logo.png"
  path_dark:     null
  position:      "top-left"
  width_px:      140
  on_every_page: false

slicers:
  global:
    enabled: true
    field: "gold_dim_date.year"
    style: "dropdown"
    position: "top-right"
  per_page:
    page_exec:
      - { field: "gold_dim_date.year", style: "dropdown", position: "right_sidebar" }
    page_pipeline:
      - { field: "gold_dim_customer.country_group", style: "dropdown", position: "right_sidebar" }
      - { field: "gold_fact_pipeline.deal_status",  style: "dropdown", position: "right_sidebar" }
    page_marketing:
      - { field: "gold_dim_campaign.campaign_type", style: "dropdown", position: "right_sidebar" }
    page_finance:
      - { field: "gold_dim_date.year",        style: "dropdown", position: "right_sidebar" }
      - { field: "gold_fact_budget.department", style: "dropdown", position: "right_sidebar" }
    page_hr:
      - { field: "gold_dim_employee.department", style: "dropdown", position: "right_sidebar" }
    page_csat:
      - { field: "gold_fact_tickets.priority", style: "dropdown", position: "right_sidebar" }
    page_quality:
      - { field: "gold_fact_tickets.category", style: "dropdown", position: "right_sidebar" }

pages:
  - key: "exec"
    enabled: true
    display_name: "1. Executive Dashboard"
    top_kpis:
      - { measure: "Revenue",                 label: "Omsætning" }
      - { measure: "Gross Margin",            label: "DB-margin" }
      - { measure: "Pipeline Value",          label: "Pipeline" }
      - { measure: "Total Tickets",           label: "Sager" }
      - { measure: "Avg Satisfaction Rating", label: "Tilfredshed" }
  - key: "pipeline"
    enabled: true
    display_name: "2. Pipeline & CRM"
  - key: "marketing"
    enabled: true
    display_name: "3. Marketing & Web"
  - key: "finance"
    enabled: true
    display_name: "4. Finance & Budget"
  - key: "hr"
    enabled: true
    display_name: "5. HR & People"
  - key: "csat"
    enabled: true
    display_name: "6. NPS & Support"
  - key: "quality"
    enabled: true
    display_name: "7. Quality & Compliance"
    note: "Medical-specific page — batch SLA, complaint trends, audit findings"

navigation:
  style: "tabs_bottom"

kpi_cards:
  style:       "framed"
  show_trend:  true
  show_target: true

charts:
  default_single_series_color: "primary"
  line_thickness: 2
  bar_data_labels: "on_hover"
  category_chart_type: "donut"
  rich_tooltips: false

interactivity:
  cross_filter: true
  drill_through_pages: ["customer_detail", "employee_detail"]
  bookmarks: false
  pdf_export_button: false

accessibility:
  wcag_level: "AA"
  alt_text_required: true

avoid_visuals: []
preserve_visuals: []
